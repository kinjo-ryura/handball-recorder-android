name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチで走行中のジョブは新しい push で打ち切る。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action は完全な commit SHA でピン留めする（handball-project#284）。`@v4` のような
# 可変タグは差し替えが効くので、タグを奪われるとランナーで任意コードが走る
# （tj-actions/changed-files 型の攻撃）。**fork される前提の public repo** なので、
# wrapper の検証（下記）と同じ理由でここも固定する。
#
# 追随するときは `git ls-remote <repo> 'refs/tags/<tag>^{}'` で**タグを peel した commit**
# を引き、末尾コメントのバージョンも一緒に直すこと。**`refs/tags/<tag>` だけを引くと
# annotated tag では tag オブジェクトの SHA が返り、commit ではない**（`gradle/actions`
# がこれ。実際に取り違えかけた）。Dependabot（`.github/dependabot.yml`）が SHA と
# コメントの両方を上げる PR を出す。

jobs:
  # ジョブ名は ruleset `protect-main` の required status check（`check`）と一致させている。
  # 変えるなら ruleset 側も同時に変えること（変えると PR が永久にマージできなくなる）。
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # ランナー同梱の SDK には buildToolsVersion = "37.0.0" が無い（app/build.gradle.kts が
      # 明示している）。compileSdk = 36 と組で入れる。
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platforms;android-36 build-tools;37.0.0'

      # Gradle 本体は wrapper が供給する（flake ではない — README「nix を使う場合」）。
      # このアクションは依存のキャッシュに加え、**コミット済みの gradle-wrapper.jar が
      # 正規の配布物かを検証する**（validate-wrappers は既定で有効）。public repo で
      # fork される前提なので、差し替えられた wrapper を黙って実行しないことに意味がある。
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # コアは prebuilt .aar として handball-toolkit の Release から取る。
      # **Rust / NDK は要らない**（ADR 0006）。外部利用者とまったく同じ経路を通る。
      #
      # 版は app/build.gradle.kts から読む。ここに版を書くと README・ビルド定義との
      # 三重管理になり、上げたときに CI だけ古い .aar で緑になる。
      - name: コアの .aar を取得
        run: |
          set -euo pipefail
          aar=$(sed -n 's/.*libs\/\(handball-toolkit-[0-9][0-9A-Za-z.+-]*\.aar\).*/\1/p' app/build.gradle.kts)
          if [ -z "$aar" ]; then
            echo "app/build.gradle.kts から .aar の版を読めませんでした。" >&2
            echo "implementation(files(\"libs/handball-toolkit-<版>.aar\")) の行を確認してください。" >&2
            exit 1
          fi
          ver=${aar#handball-toolkit-}
          ver=${ver%.aar}
          echo "toolkit $ver ($aar)"
          mkdir -p app/libs
          curl -fsSL --retry 3 -o "app/libs/$aar" \
            "https://github.com/kinjo-ryura/handball-toolkit/releases/download/v${ver}/${aar}"

      # 落とした .aar の SHA-256 をリポにコミットした値と照合する（handball-project#285）。
      # Release のアセットはタグと違って後から差し替えられるので、版が合っているだけでは
      # 「toolkit のリリース時と同じバイナリ」を保証できない。期待値も版と同じく
      # app/build.gradle.kts に置く（三重管理を避ける。版を上げるときは 2 行セットで直す）。
      # 一致しなければ、Release 側が差し替わったか、期待値の更新漏れ。どちらかを人が判断する。
      - name: コアの .aar の SHA-256 を照合
        run: |
          set -euo pipefail
          aar=$(ls app/libs/handball-toolkit-*.aar)
          expected=$(sed -n 's/.*toolkitAarSha256 = \([0-9a-f]\{64\}\).*/\1/p' app/build.gradle.kts)
          if [ -z "$expected" ]; then
            echo "app/build.gradle.kts に toolkitAarSha256 = <64 桁の hex> の行がありません。" >&2
            exit 1
          fi
          actual=$(sha256sum "$aar" | cut -d' ' -f1)
          echo "expected $expected"
          echo "actual   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::$aar の SHA-256 が app/build.gradle.kts の期待値と一致しません。" >&2
            echo "  Release のアセットが差し替わったか、版を上げたのに期待値の更新を忘れたかのどちらかです。" >&2
            echo "  手元の .aar で確かめる: shasum -a 256 $aar" >&2
            exit 1
          fi

      - name: assembleDebug
        run: ./gradlew :app:assembleDebug --console=plain

      # release は R8（minify + shrinkResources）を通る（handball-project#285）。ここで捕まるのは
      # R8 の設定エラーと「参照先が無い」類のビルド時の壊れだけで、reflection 経由の実行時の
      # 壊れ（JNA / Room）は捕まらない。そちらは配布前に端末で確かめる（README「リリースを出すとき」）。
      # 署名設定は無いので unsigned APK が出る。配布物にはならない。
      - name: assembleRelease（R8 を通す）
        run: ./gradlew :app:assembleRelease --console=plain

      # 現時点でテストは 0 件（NO-SOURCE で素通りする）。足したときに黙って
      # 走らないままにならないよう、先に経路を通しておく。
      - name: 単体テスト
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: lint
        run: ./gradlew :app:lintDebug --console=plain

      # 落ちたときに HTML レポートを見られるようにする（lint の指摘は行番号だけだと辿りにくい）。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/
          retention-days: 7
