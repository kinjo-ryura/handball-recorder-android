# Dependabot の更新設定（handball-project#284）。
#
# **SHA ピン留めと対で要る。** Action を可変タグから完全な commit SHA へ固定した
# （ci.yml）ので、放置すると上流の修正が入ってこない。手で `git ls-remote` を叩き直す
# 運用は必ず忘れるため、機械に PR を出させる。SHA ピン留めしていても Dependabot は
# SHA と末尾コメントのバージョンを両方書き換える。
#
# public リポなので無償。頻度は週次（開発は個人 1 人で、日次だと PR が溜まって
# 読まれなくなる）。**PR は自動 merge しない** — main は ruleset `protect-main` で
# PR + `check` green 必須にしてあり、依存の更新も人が中身を見て merge する。
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # **除外（`ignore:`）は 1 件も置かない。** Compose 系（compose-bom /
  # `androidx.lifecycle:*` / navigation-compose）を外していたのは、最新が
  # `checkDebugAarMetadata` で AGP 9.1.0 以上と compileSdk 37 以上を要求して落ちたため
  # （2026-09-01 実測）。**AGP 9.4.0 / compileSdk 37 へ一式で上げた 2026-09-06 に
  # その前提が消えたので除外も畳んだ**（handball-project#299）。ここへ戻さないこと。
  #
  # コアの `.aar` だけは Maven ではなく handball-toolkit の Release から `app/libs/` に
  # 落として `implementation(files(...))` で読むため（README「ビルド」）、そもそも
  # Dependabot からは見えない。版上げは向こうのリリースに合わせて手で行う。
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
